[package]
name = "eml-manager"
version = "1.0.0"
description = "Lightweight EML email viewer and manager"
authors = ["EMLManager"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mailparse = "0.15"
encoding_rs = "0.8"
base64 = "0.22"
regex = "1"
trash = "3"
walkdir = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
